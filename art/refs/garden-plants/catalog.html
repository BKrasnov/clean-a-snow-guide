<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Растения · Clean a Snow</title>
<style>
* { box-sizing: border-box }
html { color-scheme: light; scroll-padding-top: 1rem }
body { margin: 0; background: #f3f6f5; color: #2b1a11; font: 16px/1.4 system-ui, sans-serif }
main { max-width: 1500px; margin: auto; padding: clamp(16px, 4vw, 54px) }
h1 { margin: 0 0 14px; font-size: clamp(28px, 4vw, 48px); line-height: 1.1 }
h2 { margin: 2.2rem 0 .8rem }
nav { display: flex; flex-wrap: wrap; gap: 8px }
nav a { display: inline-block; padding: 6px 12px; border: 1px solid #739d87; border-radius: 7px; color: #23533f; text-decoration: none }
nav a:hover, nav a:focus-visible { background: #dbeadf }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px }
figure { margin: 0; overflow: hidden; border-radius: 9px; border: 1px solid #d6dfdc; background: white }
figcaption { padding: 10px 14px; font-size: 1.07rem; font-weight: 650 }
figcaption span { color: #597264; margin-right: .4em; font-variant-numeric: tabular-nums }
figcaption small { display: inline-block; margin-left: .6rem; color: #596961; font-size: .8rem; font-weight: 450 }
figure a, img { display: block; width: 100%; height: auto }
figure a:focus-visible { outline: 3px solid #3c8e63; outline-offset: -3px }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr } }
</style>
</head>
